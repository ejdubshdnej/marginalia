<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InsightRAG · 论文问答与溯源</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --fg: #e6e9ef; --dim: #9aa4b2; --accent: #5b9dff; --accent2: #2b5ea8;
    --hl: #3a2f14; --hlb: #d8a13a; --ok: #4ec9a0; --warn: #e0b050; --bad: #ff8080;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.65 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  .wrap { max-width: 1420px; margin: 0 auto; padding: 22px 20px 56px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  .badge { font-size: 12px; color: var(--dim); border: 1px solid var(--line);
           border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
  .badge.live { color: var(--ok); border-color: #2c4a40; }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; align-items: start; }
  @media (max-width: 1080px) { .layout { grid-template-columns: 1fr; } }

  .ask { display: flex; gap: 10px; margin-bottom: 16px; }
  #q {
    flex: 1; padding: 12px 15px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); font-size: 15px; outline: none;
  }
  #q:focus { border-color: var(--accent2); }
  button {
    padding: 12px 20px; border-radius: 10px; border: 0; cursor: pointer;
    background: var(--accent); color: #06101f; font-weight: 600; font-size: 14px;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    font-weight: 500; padding: 7px 13px; font-size: 13px;
  }
  button.ghost:hover:not(:disabled) { border-color: var(--accent2); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          overflow: hidden; margin-bottom: 16px; }
  .card h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--dim);
    margin: 0; padding: 11px 15px; border-bottom: 1px solid var(--line); font-weight: 600;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .card h2 .aux { font-size: 11px; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .body { padding: 15px; }
  #answer { white-space: pre-wrap; }
  #answer .cite {
    display: inline-block; min-width: 18px; text-align: center; padding: 0 4px;
    margin: 0 1px; border-radius: 4px; background: var(--accent2); color: #dce9ff;
    font-size: 12px; cursor: pointer; vertical-align: super; line-height: 1.4;
    border: 1px solid transparent;
  }
  #answer .cite:hover { border-color: var(--accent); background: var(--accent); color: #06101f; }
  #answer .cite.fake { background: #5a1f1f; color: #ffc9c9; text-decoration: line-through; }
  .src { padding: 12px 15px; border-bottom: 1px solid var(--line); transition: background .25s; }
  .src:last-child { border-bottom: 0; }
  .src.hl { background: var(--hl); box-shadow: inset 3px 0 0 var(--hlb); }
  .src .meta { font-size: 12px; color: var(--dim); margin-bottom: 5px;
               display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
  .src .n { background: var(--accent2); color: #dce9ff; border-radius: 4px;
            padding: 1px 7px; font-weight: 600; }
  .src .txt { font-size: 13.5px; color: #c8cfda; max-height: 92px; overflow: hidden; }
  .src.hl .txt { max-height: none; }
  .lat { font-size: 12px; color: var(--dim); margin-top: 10px; }
  .err { color: var(--bad); }
  .empty { color: var(--dim); font-size: 14px; }
  .muted { color: var(--dim); font-size: 12.5px; }

  /* ---- 右侧索引面板 ---- */
  .idx-head { display: flex; flex-direction: column; gap: 3px; padding: 13px 15px;
              border-bottom: 1px solid var(--line); }
  .idx-name { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.off { background: var(--dim); }
  .idx-path { font-size: 11.5px; color: var(--dim); word-break: break-all;
              font-family: Consolas, "Cascadia Mono", monospace; }
  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
  .stat { padding: 10px 12px; text-align: center; border-right: 1px solid var(--line); }
  .stat:last-child { border-right: 0; }
  .stat b { display: block; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--dim); }

  table.files { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.files th { text-align: left; color: var(--dim); font-weight: 500; padding: 7px 12px;
                   border-bottom: 1px solid var(--line); font-size: 11px; }
  table.files td { padding: 7px 12px; border-bottom: 1px solid #21252e;
                   font-family: Consolas, "Cascadia Mono", monospace; }
  table.files tr:last-child td { border-bottom: 0; }
  table.files td.n { text-align: right; font-variant-numeric: tabular-nums; }
  table.files td.t { color: var(--dim); text-align: right; white-space: nowrap; }

  .list { max-height: 250px; overflow-y: auto; }
  .item { display: flex; align-items: center; gap: 9px; padding: 10px 15px;
          border-bottom: 1px solid #21252e; cursor: pointer; }
  .item:last-child { border-bottom: 0; }
  .item:hover { background: var(--panel2); }
  .item.cur { background: #172433; box-shadow: inset 3px 0 0 var(--accent); cursor: default; }
  .item .grow { flex: 1; min-width: 0; }
  .item .nm { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .sub { font-size: 11px; color: var(--dim); }
  .item .del { color: var(--dim); font-size: 15px; padding: 0 4px; border-radius: 4px;
               background: none; border: 0; cursor: pointer; }
  .item .del:hover { color: var(--bad); }

  .up { padding: 13px 15px; display: flex; flex-direction: column; gap: 9px; }
  .up .row { display: flex; gap: 8px; }
  .up input[type=text] {
    flex: 1; padding: 8px 11px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--fg); font-size: 13px; outline: none; min-width: 0;
  }
  .up input[type=text]:focus { border-color: var(--accent2); }
  .up input[type=file] { font-size: 12px; color: var(--dim); }
  .up input[type=file]::file-selector-button {
    padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--fg); cursor: pointer; margin-right: 10px;
    font-size: 12.5px; font-family: inherit;
  }
  .prog { font-size: 12px; padding: 8px 11px; border-radius: 8px;
          background: #2a2415; color: var(--warn); border: 1px solid #4a3d1c; }
  .prog.ok { background: #14251f; color: var(--ok); border-color: #22453a; }
  .prog.bad { background: #2a1616; color: var(--bad); border-color: #4a2222; }
  .hint { font-size: 11.5px; color: var(--dim); line-height: 1.55; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>InsightRAG</h1>
    <span class="badge" id="badge-corpus">—</span>
    <span class="badge">混合检索 RRF + CrossEncoder 重排</span>
    <span class="badge" id="health">连接中…</span>
  </header>

  <div class="layout">
    <!-- 左：问答 -->
    <div>
      <div class="ask">
        <input id="q" placeholder="问点什么，例如：Why is RRF preferred over weighted sum for hybrid retrieval?" autocomplete="off">
        <button id="go">提问</button>
      </div>

      <div class="card">
        <h2>答案</h2>
        <div class="body"><div id="answer" class="empty">答案会出现在这里，点 [n] 可跳到下方出处。</div>
          <div class="lat" id="lat"></div>
        </div>
      </div>

      <div class="card">
        <h2>出处</h2>
        <div id="sources"><div class="body empty">检索到的原文块会出现在这里。</div></div>
      </div>
    </div>

    <!-- 右：索引 -->
    <div>
      <div class="card">
        <h2>当前索引 <span class="aux" id="is-default"></span></h2>
        <div class="idx-head">
          <div class="idx-name"><span class="dot" id="dot"></span><span id="cur-name">—</span></div>
          <div class="idx-path" id="cur-path">—</div>
        </div>
        <div class="stat-row">
          <div class="stat"><b id="s-chunks">—</b><span>块</span></div>
          <div class="stat"><b id="s-pages">—</b><span>页</span></div>
          <div class="stat"><b id="s-size">—</b><span>体积</span></div>
        </div>
        <table class="files">
          <thead><tr><th>文件</th><th class="n">大小</th><th class="t">修改</th></tr></thead>
          <tbody id="file-rows"></tbody>
        </table>
      </div>

      <div class="card">
        <h2>可用语料 <span class="aux" id="idx-count"></span></h2>
        <div class="list" id="idx-list"><div class="body empty">加载中…</div></div>
      </div>

      <div class="card">
        <h2>迁移新文档</h2>
        <div class="up">
          <input type="file" id="pdf" accept="application/pdf,.pdf">
          <div class="row">
            <input type="text" id="newname" placeholder="名字（可选，默认用文件名）">
            <button id="upload" disabled>建库</button>
          </div>
          <div class="hint">
            上传一份和当前语料无关的 PDF，会**新建**一套独立索引（不动现有索引）。
            建完点列表里的它才切换过去。上限 40 MB。
          </div>
          <div class="prog" id="prog" style="display:none"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const qEl = $('#q'), goEl = $('#go'), ansEl = $('#answer'), srcEl = $('#sources'), latEl = $('#lat');
let citations = [];
let health = {};

const fmtBytes = (n) => {
  if (!n && n !== 0) return '—';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(2) + ' MB';
};
const fmtTime = (ts) => {
  if (!ts) return '—';
  const d = new Date(ts * 1000);
  const p = (x) => String(x).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g,
  m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

// ---------------------------------------------------------------- 健康状态
async function refreshHealth() {
  try {
    const d = await (await fetch('/health')).json();
    health = d;
    $('#health').textContent = `${d.status} · ${d.model}`;
    $('#health').className = 'badge live';
    $('#badge-corpus').textContent = `${d.index_name} · ${d.chunks} 块`;
    $('#cur-name').textContent = d.index_name;
    $('#cur-path').textContent = d.index_dir;
    $('#is-default').textContent = d.is_default ? '默认论文库' : '迁移语料';
    $('#dot').className = 'dot';
  } catch (e) {
    $('#health').textContent = '服务未连接';
    $('#health').className = 'badge';
    $('#dot').className = 'dot off';
  }
}

// ---------------------------------------------------------------- 索引列表
async function refreshIndexes() {
  let data;
  try { data = await (await fetch('/indexes')).json(); }
  catch (e) { $('#idx-list').innerHTML = `<div class="body err">读取索引列表失败：${escapeHtml(e.message)}</div>`; return; }

  const items = data.items || [];
  $('#idx-count').textContent = `${items.length} 套`;

  const cur = items.find(i => i.active);
  if (cur) {
    $('#s-chunks').textContent = cur.chunks.toLocaleString();
    $('#s-pages').textContent = cur.pages.toLocaleString();
    $('#s-size').textContent = fmtBytes(cur.files.reduce((a, f) => a + f.bytes, 0));
    $('#file-rows').innerHTML = cur.files.map(f => `
      <tr><td>${escapeHtml(f.name)}</td>
          <td class="n">${fmtBytes(f.bytes)}</td>
          <td class="t">${fmtTime(f.mtime)}</td></tr>`).join('');
    $('#cur-name').textContent = cur.title || cur.name;
  } else {
    $('#file-rows').innerHTML = '<tr><td colspan="3" class="muted">索引文件缺失</td></tr>';
  }

  $('#idx-list').innerHTML = items.map(i => `
    <div class="item ${i.active ? 'cur' : ''}" data-dir="${escapeHtml(i.dir)}" data-active="${i.active}">
      <div class="grow">
        <div class="nm">${i.active ? '● ' : ''}${escapeHtml(i.title || i.name)}</div>
        <div class="sub">${i.pages} 页 · ${i.chunks.toLocaleString()} 块 · ${fmtTime(i.built_at)}</div>
      </div>
      ${i.active ? '<span class="muted">使用中</span>'
                 : `<button class="del" title="删除这套索引" data-del="${escapeHtml(i.dir)}">✕</button>`}
    </div>`).join('') || '<div class="body empty">只有默认库。</div>';

  $('#idx-list').querySelectorAll('.item').forEach(el => {
    el.addEventListener('click', async (ev) => {
      if (ev.target.dataset.del) return;
      if (el.dataset.active === 'true') return;
      await switchTo(el.dataset.dir);
    });
  });
  $('#idx-list').querySelectorAll('[data-del]').forEach(b => {
    b.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const dir = b.dataset.del;
      const nm = dir.split(/[\\/]/).pop();
      if (!confirm(`删除索引「${nm}」？索引文件会从磁盘移除，源 PDF 也一起删。`)) return;
      const r = await fetch('/indexes?dir=' + encodeURIComponent(dir), { method: 'DELETE' });
      if (!r.ok) { setProg('删除失败：' + (await r.json()).detail, 'bad'); return; }
      await refreshAll();
    });
  });
}

async function switchTo(dir) {
  setProg('切换索引…', '');
  try {
    const r = await fetch('/indexes/switch', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dir })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
    ansEl.textContent = '已切换索引，问点什么试试。'; ansEl.classList.add('empty');
    latEl.textContent = ''; srcEl.innerHTML = '<div class="body empty">检索到的原文块会出现在这里。</div>';
    setProg(`已切到「${d.name}」（${d.chunks} 块），模型没重载。`, 'ok');
    await refreshAll();
  } catch (e) {
    setProg('切换失败：' + e.message, 'bad');
  }
}

// ---------------------------------------------------------------- 上传建库
function setProg(msg, kind) {
  const el = $('#prog');
  if (!msg) { el.style.display = 'none'; return; }
  el.style.display = '';
  el.className = 'prog' + (kind ? ' ' + kind : '');
  el.textContent = msg;
}

const pdfEl = $('#pdf'), nameEl = $('#newname'), upEl = $('#upload');
pdfEl.addEventListener('change', () => {
  upEl.disabled = !pdfEl.files.length;
  if (pdfEl.files.length && !nameEl.value.trim()) {
    nameEl.placeholder = '默认：' + pdfEl.files[0].name.replace(/\.pdf$/i, '');
  }
});

upEl.addEventListener('click', async () => {
  const f = pdfEl.files[0];
  if (!f) return;
  const fd = new FormData();
  fd.append('file', f);
  fd.append('name', nameEl.value.trim());

  upEl.disabled = true; pdfEl.disabled = true;
  setProg('上传中…', '');
  const t0 = Date.now();
  const tick = setInterval(() => {
    setProg(`建库中… ${((Date.now() - t0) / 1000).toFixed(0)} s（解析 → 切块 → 向量化 → 落盘）`, '');
  }, 500);

  try {
    const r = await fetch('/indexes/upload', { method: 'POST', body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
    const i = d.info;
    setProg(`建好了「${i.name}」：${i.pages} 页 / ${i.chunks} 块 / ${i.seconds.total} s。点右边列表里的它切换过去。`, 'ok');
    pdfEl.value = ''; nameEl.value = '';
    await refreshAll();
  } catch (e) {
    setProg('建库失败：' + e.message, 'bad');
  } finally {
    clearInterval(tick);
    upEl.disabled = !pdfEl.files.length;
    pdfEl.disabled = false;
  }
});

async function refreshAll() { await Promise.all([refreshHealth(), refreshIndexes()]); }

// ---------------------------------------------------------------- 问答
function render(data) {
  citations = data.citations || [];
  const nValid = citations.length;

  let html = escapeHtml(data.answer || '').replace(/\[(\d+)\]/g, (m, d) => {
    const n = parseInt(d, 10);
    const fake = n < 1 || n > nValid;
    return `<span class="cite${fake ? ' fake' : ''}" data-n="${n}">${n}</span>`;
  });
  ansEl.innerHTML = html;
  ansEl.classList.remove('empty');

  ansEl.querySelectorAll('.cite').forEach(el => {
    el.addEventListener('click', () => {
      const target = document.getElementById('src-' + el.dataset.n);
      if (!target) return;
      document.querySelectorAll('.src').forEach(s => s.classList.remove('hl'));
      target.classList.add('hl');
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  });

  if (!citations.length) {
    srcEl.innerHTML = '<div class="body empty">本次没有检索到出处。</div>';
    return;
  }
  srcEl.innerHTML = citations.map(c => `
    <div class="src" id="src-${c.n}">
      <div class="meta">
        <span class="n">[${c.n}]</span>
        <span>${escapeHtml(c.paper || '')}</span>
        <span>p${c.page}</span>
        <span>${escapeHtml(c.chunk_id)}</span>
        <span>${escapeHtml(c.source || '')}</span>
      </div>
      <div class="txt">${escapeHtml((c.text || '').trim())}</div>
    </div>`).join('');

  const L = data.latency || {};
  latEl.textContent = `检索 ${L.retrieve_ms} ms · 生成 ${L.generate_ms} ms · 合计 ${L.total_ms} ms`;
}

async function ask() {
  const q = qEl.value.trim();
  if (!q) return;
  goEl.disabled = true; goEl.textContent = '检索中…';
  ansEl.textContent = '正在检索并生成…'; ansEl.classList.add('empty'); latEl.textContent = '';
  try {
    const r = await fetch('/ask', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, top_k: 5 })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    render(await r.json());
  } catch (e) {
    ansEl.innerHTML = `<span class="err">请求失败：${escapeHtml(e.message)}</span>`;
  } finally {
    goEl.disabled = false; goEl.textContent = '提问';
  }
}

goEl.addEventListener('click', ask);
qEl.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });

refreshAll();
</script>
</body>
</html>
